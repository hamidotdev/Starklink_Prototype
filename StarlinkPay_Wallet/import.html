<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Import Wallet</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="text-white min-h-screen flex flex-col justify-center items-center px-6 mx-auto">

  <div class="w-full max-w-[450px] space-y-6 bg-[#031A42] h-screen px-10">
    <h1 class="text-2xl font-bold text-center">Import Wallet</h1>

    <p class="text-sm text-gray-300 text-center">Paste your 12-word recovery phrase:</p>

    <textarea id="importInput" rows="3"
      class="w-full p-3 bg-gray-800 text-white rounded resize-none"
      placeholder="e.g. canyon basket muscle ..."></textarea>

    <button id="importBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded text-lg">
      Import Wallet
    </button>

    <p id="importError" class="text-red-500 text-sm text-center hidden">Invalid phrase. Please try again.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script>
    document.getElementById("importBtn").addEventListener("click", () => {
      const phrase = document.getElementById("importInput").value.trim();

      try {
        const wallet = ethers.Wallet.fromMnemonic(phrase);
        localStorage.setItem("mnemonic", phrase);
        localStorage.setItem("privateKey", wallet.privateKey);
        window.location.href = "dashboard.html";
      } catch (err) {
        document.getElementById("importError").classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
