<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class=" text-white min-h-screen flex flex-col justify-between max-w-[450px] mx-auto">

  <div class="p-4 space-y-6 h-screen max-w-[450px] bg-[#031A42]">
    <div class="text-center">
      <p class="text-gray-400 text-sm">Wallet Address:</p>
      <p id="walletAddress" class="text-green-400 text-xs break-words"></p>
    </div>

    <div class="text-center">
      <p class="text-sm text-gray-300">Balance</p>
      <h2 id="balance" class="text-4xl font-bold text-white">0 ETH</h2>
    </div>

    <div class="flex justify-center space-x-4">
      <a href="send.html" class="bg-pink-600 hover:bg-pink-700 px-6 py-2 rounded">Send</a>
      <a href="receive.html" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded">Receive</a>
    </div>

    <div>
      <h3 class="text-lg font-semibold mb-2">Tokens</h3>
      <ul id="tokenList" class="space-y-2">
        <li class="bg-gray-800 p-3 rounded flex justify-between">
          <span>Ethereum</span>
          <span>0 ETH</span>
        </li>
        <!-- More tokens can go here later -->
      </ul>
    </div>
  </div>

  <footer class="bg-gray-900 text-center text-sm py-3 h-screen max-w-[450px] bg-[#031A42]">
    <a href="dashboard.html" class="mx-3 text-pink-400">Home</a>
    <a href="send.html" class="mx-3 text-gray-400">Send</a>
    <a href="receive.html" class="mx-3 text-gray-400">Receive</a>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script>
    async function loadWallet() {
      const privateKey = localStorage.getItem("privateKey");

      if (!privateKey) {
        alert("Wallet not found. Redirecting...");
        window.location.href = "index.html";
        return;
      }

      const provider = new ethers.providers.EtherscanProvider(); // optional: replace with Infura, Alchemy, etc.
      const wallet = new ethers.Wallet(privateKey, provider);

      document.getElementById("walletAddress").textContent = wallet.address;

      try {
        const balance = await wallet.getBalance();
        const eth = ethers.utils.formatEther(balance);
        document.getElementById("balance").textContent = `${parseFloat(eth).toFixed(4)} ETH`;
      } catch {
        document.getElementById("balance").textContent = "0 ETH";
      }
    }

    loadWallet();
  </script>
</body>
</html>
